server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/boleteria}
    username: ${DB_USER:boleteria}
    password: ${DB_PASSWORD:boleteria}
  jpa:
    hibernate:
      ddl-auto: validate          # el esquema lo define Flyway; Hibernate solo valida
    open-in-view: false
    properties:
      hibernate:
        default_schema: auth
  flyway:
    schemas: [auth]

# HS256 exige >= 32 bytes; el valor por defecto cumple (39 bytes).
jwt:
  secret: ${JWT_SECRET:demo-secret-para-jwt-hs256-de-32-bytes!!}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
